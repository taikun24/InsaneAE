buildscript {
    repositories {
        // These repositories are only for Gradle plugins, put any other repositories in the repository block further below
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

apply plugin: 'org.spongepowered.mixin'

group = mod_group_id
version = mod_version

base {
    // jar 名に MC バージョンを入れる (insaneae-1.20.1-1.0.2.1.jar)。
    // 1.21.1 ブランチと同名の jar が出ると GitHub Releases で区別できなくなるため。
    archivesName = "${mod_id}-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    // IDE の出力先でも ProcessResources を走らせる。これが true でないとテンプレートが動かない。
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'

            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        // 登録済みの GameTest を全部走らせて終了する。GameTest が 1 つも無いとサーバーはクラッシュする。
        gameTestServer {
            // AE2 のテストプロット基盤に相乗りしているので ae2 名前空間も有効にする
            // (自前のプロットも ae2.<plot id> という名前で走る)。
            property 'forge.enabledGameTestNamespaces', "${mod_id},ae2"
            // これが無いと AE2 はプロットを GameTest として登録しない。
            property 'appeng.tests', 'true'
        }

        data {
            workingDirectory project.file('run-data')

            // --existing-mod: 流用している AE2 / MEGA Cells / AppliedFlux のテクスチャを
            // ExistingFileHelper に見せるため (無いとモデル生成時に存在チェックで落ちる)。
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'),
                    '--existing', file('src/main/resources/'),
                    '--existing-mod', 'ae2', '--existing-mod', 'megacells',
                    // FE セルの筐体は AppliedFlux のテクスチャを借りている。
                    '--existing-mod', 'appflux'
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"

    config "${mod_id}.mixins.json"
    // 他 Mod との共存用は required=false の別 config に分けてある
    // (相手が同じ AE2 メソッド／画面を触っていても起動を止めないため)。
    config "${mod_id}.compat.mixins.json"
    // ACO の公開連携境界に乗るぶん。ACO が無ければ AcoMixinPlugin が適用を止める。
    config "${mod_id}.aco.mixins.json"
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// ---------------------------------------------------------------- ACO の API jar
//
// ACO の公開連携境界はインターフェイス実装が前提なので compileOnly が要る。
// CurseForge にも Maven にも上がっていないので、GitHub Releases から取ってくる。
// 取得済みなら何もしない (オフラインでもビルドできる)。
// 実行時は fg.deobf を通す必要があるので、flatDir 経由の blank:aco:<ver> を使う。
// -PacoVersion=... で差し替えられる (未リリースの ACO を試すとき用)。
ext.aco_version = project.findProperty('acoVersion') ?: '1.5.22'
ext.acoJarFile = file("libs/aco-${aco_version}.jar")

// dev 実行にだけ別バージョンを載せたいとき用 (-PacoRuntimeVersion=1.5.19)。
// 「新しい ACO でコンパイルしたものを、古い ACO の環境で動かす」を試すためにある。
ext.aco_runtime_version = project.findProperty('acoRuntimeVersion') ?: aco_version
ext.acoRuntimeJarFile = file("libs/aco-${aco_runtime_version}.jar")

var downloadAco = tasks.register('downloadAco') {
    description = 'GitHub Releases から ACO の jar を取得する (compileOnly 用)'
    outputs.file(acoJarFile)
    // 取得済みなら up-to-date。ネットワークが無くてもビルドが通る。
    onlyIf { !acoJarFile.exists() }
    doLast {
        acoJarFile.parentFile.mkdirs()
        var url = "https://github.com/syarukasu/ae2-crafting-optimizer/releases/download/" +
                "v${aco_version}/aco${aco_version}_${minecraft_version}.jar"
        logger.lifecycle("ACO ${aco_version} を取得: ${url}")
        new java.net.URL(url).withInputStream { input ->
            acoJarFile.withOutputStream { it << input }
        }
    }
}

// files(...) にタスクを紐付けておかないと、jar がまだ無い状態で compileJava が走る。
ext.acoApiJar = files(acoJarFile) { builtBy downloadAco }

repositories {
    flatDir {
        // ローカル jar 用 (ACO の実機テストなど)。libs/ は gitignore 済み。
        dir 'libs'
    }
    maven {
        url "https://cursemaven.com"
    }
    maven {
        // AE2 は Modrinth の maven から取る (cursemaven は AE2 の新しいファイルが引けないことがある)
        url "https://api.modrinth.com/maven"
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    implementation fg.deobf("maven.modrinth:ae2:15.4.10")
    // MEGA Cells (megacells) — 1M〜256M のクラフトストレージはこちらに委譲するため必須依存。
    implementation fg.deobf("curse.maven:mega-cells-622112:6175008")
    // Cloth Config API — MEGA Cells が mandatory 依存として要求する (無いと FML の依存解決で落ちる)。
    runtimeOnly fg.deobf("curse.maven:cloth-config-348521:5729105")
    // Applied Mekanistics (+ Mekanism) — 化学物質セル用の【任意】依存。
    // 無くても動くよう ModList で分岐しているが、コンパイルには型が要るので compileOnly。
    // runtimeOnly は dev で実際に化学物質セルを触るためのもの。
    compileOnly fg.deobf("curse.maven:mekanism-268560:6552911")
    compileOnly fg.deobf("curse.maven:applied-mekanistics-574300:7244744")
    // -PwithAppMek=false を付けると dev 実行から外れる (未導入時の動作確認用)。
    if (project.findProperty('withAppMek') != 'false') {
        runtimeOnly fg.deobf("curse.maven:mekanism-268560:6552911")
        runtimeOnly fg.deobf("curse.maven:applied-mekanistics-574300:7244744")
    }
    // AppliedFlux — FE ストレージセル用の【任意】依存 (appmek と同じ扱い)。
    // FE セルは AppliedFlux の IFluxCell を実装し、セルの中身は AppliedFlux 自身の
    // セルハンドラが扱うので、型を見るために compileOnly が要る。
    compileOnly fg.deobf("curse.maven:applied-flux-965012:7651647")
    // -PwithAppFlux=false を付けると dev 実行から外れる (未導入時の動作確認用)。
    // (-PwithAstral=true でも同じものが入る。座標が同じなので重複はしない)
    if (project.findProperty('withAppFlux') != 'false') {
        runtimeOnly fg.deobf("curse.maven:applied-flux-965012:7651647")
        // AppliedFlux の mandatory 依存 (作者の共通ライブラリ)。
        runtimeOnly fg.deobf("curse.maven:glodium-957920:5226922")
    }
    runtimeOnly fg.deobf("curse.maven:guideme-1173950:8204776")
    // AE2 Crafting Optimizer。
    //
    // <b>compileOnly は常に入る。</b>ACO の公開連携境界 (api.contract / api.craftingtable /
    // api.batch.v2) は「インターフェイスを実装する」形なので、反射では代用できないため。
    // jar は GitHub Releases から downloadAco が取ってくる (CI でも引ける)。
    // ここは deobf しない — ACO 自身の API はクラス名もメソッド名も難読化されないので、
    // コンパイルにはそのままで足りる。
    compileOnly acoApiJar
    //
    // 実行時は<b>従来どおり任意依存</b>。dev に載せるのは -PwithAco=true のときだけで、
    // <b>配布 jar は SRG 名なので fg.deobf が必須</b> (そのまま run/mods に置くと dev では落ちる)。
    // 既定でオフなのは、ACO が AE2 の挙動自体を変える (実行バッチの乗っ取り・プロバイダ結合等) ため
    // ACO 前提でないゲームテストが複数落ちるから。回すときは落ちる前提で読むこと。
    if (project.findProperty('withAco') == 'true') {
        // flatDir は設定時に実体が要るので、ここだけ遅延させずに取りに行く
        // (compileOnly 側の downloadAco と違い、タスクでは間に合わない)。
        if (!acoRuntimeJarFile.exists()) {
            acoRuntimeJarFile.parentFile.mkdirs()
            var runtimeUrl = "https://github.com/syarukasu/ae2-crafting-optimizer/releases/download/" +
                    "v${aco_runtime_version}/aco${aco_runtime_version}_${minecraft_version}.jar"
            logger.lifecycle("ACO ${aco_runtime_version} を取得 (dev 実行用): ${runtimeUrl}")
            new java.net.URL(runtimeUrl).withInputStream { input ->
                acoRuntimeJarFile.withOutputStream { it << input }
            }
        }
        runtimeOnly fg.deobf("blank:aco:${aco_runtime_version}")
    }
    // Astral Mekanism & Energistics — 自動搬出をネットワークへ流す互換 Mixin
    // (compat.AstralEjectorMixin) の実機テスト用【任意・オプトイン】。
    // Mixin は @Pseudo + targets 指定なのでコンパイルには要らない (Mekanism の型だけ要る)。
    // -PwithAstral=true で dev 実行に載る。既定でオフなのは、Astral が Mekanism の
    // 機械を大量に足すぶん dev の起動が重くなるため。
    // Astral は必須依存が 14 個ある (mods.toml が全部 mandatory=true)。
    // バージョンの組み合わせは実際に遊んでいるモッドパックの manifest.json から取った。
    if (project.findProperty('withAstral') == 'true') {
        runtimeOnly fg.deobf("curse.maven:astral-mekanism-1415150:8601842")
        runtimeOnly fg.deobf("curse.maven:mekanism-generators-268566:6552914")
        runtimeOnly fg.deobf("curse.maven:mekanism-tools-268567:6552915")
        runtimeOnly fg.deobf("curse.maven:evolved-mekanism-1230085:7599591")
        runtimeOnly fg.deobf("curse.maven:mekanism-extras-1026040:8247562")
        runtimeOnly fg.deobf("curse.maven:evolved-mekanism-extras-1268159:8294797")
        runtimeOnly fg.deobf("curse.maven:compact-mekanism-machines-1161015:7388773")
        runtimeOnly fg.deobf("curse.maven:mekanism-elements-1103224:6537553")
        runtimeOnly fg.deobf("curse.maven:advancedae-1084104:7939754")
        runtimeOnly fg.deobf("curse.maven:ae2addonlib-1366135:7668681")
        runtimeOnly fg.deobf("curse.maven:applied-flux-965012:7651647")
        runtimeOnly fg.deobf("curse.maven:botany-pots-353928:7612402")
        runtimeOnly fg.deobf("curse.maven:bookshelf-228525:7612389")
        runtimeOnly fg.deobf("curse.maven:stack-upgrade-integration-1510741:8298822")
        // 上の 2 つが要求する図書館 Mod。
        runtimeOnly fg.deobf("curse.maven:glodium-957920:5226922")
        runtimeOnly fg.deobf("curse.maven:iglee-library-541199:6987117")
        runtimeOnly fg.deobf("curse.maven:geckolib-388172:8285794")
    }

    // ME Infinity Cell 1.20.1-5.0.0 — 無限セルの在庫を ACO に BigInteger で見せる @Pseudo Mixin の
    // 実機確認用【任意・オプトイン】。-PwithInfinityCell=true で dev 実行に載る。
    // Mixin は文字列でクラスを指すので、コンパイルにも型は要らない。
    if (project.findProperty('withInfinityCell') == 'true') {
        runtimeOnly fg.deobf("curse.maven:me-infinity-cell-1320551:7277426")
    }

    // Advanced AE — 自前のクラフト CPU (AdvCraftingCPULogic) へ入れている compat Mixin
    // (compat.AdvCraftingCpuLogicMixin / compat.AdvCraftingCpuBudgetMixin) の実機確認用
    // 【任意・オプトイン】。-PwithAdvancedAe=true で dev 実行に載る (-PwithAstral=true にも含まれる)。
    // 既定でオフなのは、Advanced AE 自身が AE2 の挙動を変えるためゲームテストの前提が変わるから。
    if (project.findProperty('withAdvancedAe') == 'true') {
        runtimeOnly fg.deobf("curse.maven:advancedae-1084104:7939754")
        // Advanced AE の mandatory 依存。FML が止まってから分かる類なので明示しておく。
        runtimeOnly fg.deobf("curse.maven:ae2addonlib-1366135:7668681")
        runtimeOnly fg.deobf("curse.maven:geckolib-388172:8285794")
    }

    // JEI — 【任意】。AE2 15.x の JEI 連携のチャージャーに改良チャージャーを触媒として足す
    // (integration/jei)。@JeiPlugin なので JEI が無ければ読まれない。
    compileOnly fg.deobf("curse.maven:jei-238222:8500005")
    runtimeOnly fg.deobf("curse.maven:jei-238222:8500005")
    testImplementation platform("org.junit:junit-bom:5.10.2")
    testImplementation "org.junit.jupiter:junit-jupiter"
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

// mods.toml と pack.mcmeta の ${} を gradle.properties の値で置換する。
// 定義の無いプロパティを参照するとエラーになる。
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [minecraft_version   : minecraft_version, minecraft_version_range: minecraft_version_range,
                             forge_version       : forge_version, forge_version_range: forge_version_range,
                             loader_version_range: loader_version_range,
                             mod_id              : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
                             mod_authors         : mod_authors, mod_description: mod_description,]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes(["Specification-Title"     : mod_id,
                    "Specification-Vendor"    : mod_authors,
                    "Specification-Version"   : "1",
                    "Implementation-Title"    : project.name,
                    "Implementation-Version"  : project.jar.archiveVersion,
                    "Implementation-Vendor"   : mod_authors,
                    "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")])
    }

    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
