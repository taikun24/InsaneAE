plugins {
    id 'idea'
    id 'java-library'
    // 1.21.1 ブランチと同じ ModDevGradle の Forge 1.20.1 版。両ブランチを同じプラグインにそろえ、
    // Gradle 9 が要る新しい Stonecutter に載せられるようにしている (ForgeGradle 6 は Gradle 8 まで)。
    id 'net.neoforged.moddev.legacyforge' version '2.0.91'
}

group = mod_group_id
version = mod_version

base {
    // jar 名に MC バージョンを入れる (insaneae-1.20.1-1.0.2.1.jar)。
    // 1.21.1 ブランチと同名の jar が出ると GitHub Releases で区別できなくなるため。
    archivesName = "${mod_id}-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

// ゲームテスト (AE2 のテストプロットに相乗りした検証) は配布 jar に入れない。
// 本体のクラスとクラスパスをそのまま使う別のソースセットにして、gameTestServer の実行にだけ載せる。
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

legacyForge {
    version = "${minecraft_version}-${forge_version}"

    runs {
        client {
            client()
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            server()
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
            programArgument '--nogui'
        }

        // 登録済みの GameTest を全部走らせて終了する。GameTest が 1 つも無いとサーバーはクラッシュする。
        gameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.gametest
            // AE2 のテストプロット基盤に相乗りしているので ae2 名前空間も有効にする
            // (自前のプロットも ae2.<plot id> という名前で走る)。
            systemProperty 'forge.enabledGameTestNamespaces', "${mod_id},ae2"
            // これが無いと AE2 はプロットを GameTest として登録しない。
            systemProperty 'appeng.tests', 'true'
        }

        data {
            data()
            gameDirectory = project.file('run-data')

            // --existing-mod: 流用している AE2 / MEGA Cells / AppliedFlux のテクスチャを
            // ExistingFileHelper に見せるため (無いとモデル生成時に存在チェックで落ちる)。
            programArguments.addAll '--mod', mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath(),
                    '--existing-mod', 'ae2', '--existing-mod', 'megacells',
                    // FE セルの筐体は AppliedFlux のテクスチャを借りている。
                    '--existing-mod', 'appflux', '--existing-mod', 'ae2things'
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.gametest)
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"

    config "${mod_id}.mixins.json"
    // 他 Mod との共存用は required=false の別 config に分けてある
    // (相手が同じ AE2 メソッド／画面を触っていても起動を止めないため)。
    config "${mod_id}.optional.mixins.json"
    // ACO の公開連携境界に乗るぶん。ACO が無ければ AcoMixinPlugin が適用を止める。
    config "${mod_id}.aco.mixins.json"
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// ---------------------------------------------------------------- ACO の API jar
//
// ACO の公開連携境界はインターフェイス実装が前提なので compileOnly が要る。
// CurseForge にも Maven にも上がっていないので、GitHub Releases から取ってくる。
// 取得済みなら何もしない (オフラインでもビルドできる)。
// 実行時は SRG 名から戻す必要があるので、flatDir 経由の blank:aco:<ver> を modRuntimeOnly に渡す。
// -PacoVersion=... で差し替えられる (未リリースの ACO を試すとき用)。
ext.aco_version = project.findProperty('acoVersion') ?: '1.5.22'
ext.acoJarFile = file("libs/aco-${aco_version}.jar")

// dev 実行にだけ別バージョンを載せたいとき用 (-PacoRuntimeVersion=1.5.19)。
// 「新しい ACO でコンパイルしたものを、古い ACO の環境で動かす」を試すためにある。
ext.aco_runtime_version = project.findProperty('acoRuntimeVersion') ?: aco_version
ext.acoRuntimeJarFile = file("libs/aco-${aco_runtime_version}.jar")

var downloadAco = tasks.register('downloadAco') {
    description = 'GitHub Releases から ACO の jar を取得する (compileOnly 用)'
    outputs.file(acoJarFile)
    // 取得済みなら up-to-date。ネットワークが無くてもビルドが通る。
    onlyIf { !acoJarFile.exists() }
    doLast {
        acoJarFile.parentFile.mkdirs()
        var url = "https://github.com/syarukasu/ae2-crafting-optimizer/releases/download/" +
                "v${aco_version}/aco${aco_version}_${minecraft_version}.jar"
        logger.lifecycle("ACO ${aco_version} を取得: ${url}")
        new java.net.URL(url).withInputStream { input ->
            acoJarFile.withOutputStream { it << input }
        }
    }
}

// files(...) にタスクを紐付けておかないと、jar がまだ無い状態で compileJava が走る。
ext.acoApiJar = files(acoJarFile) { builtBy downloadAco }

repositories {
    flatDir {
        // ローカル jar 用 (ACO の実機テストなど)。libs/ は gitignore 済み。
        dir 'libs'
    }
    maven {
        url "https://cursemaven.com"
    }
    maven {
        // AE2 は Modrinth の maven から取る (cursemaven は AE2 の新しいファイルが引けないことがある)
        url "https://api.modrinth.com/maven"
    }
}

dependencies {
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    // @Nullable 用。ModDevGradle ではマイクラ本体の依存として付いてこない。
    compileOnly 'org.jetbrains:annotations:24.1.0'
    modImplementation "maven.modrinth:ae2:15.4.10"
    // MEGA Cells (megacells) — 1M〜256M のクラフトストレージはこちらに委譲するため必須依存。
    modImplementation "curse.maven:mega-cells-622112:6175008"
    // Cloth Config API — MEGA Cells が mandatory 依存として要求する (無いと FML の依存解決で落ちる)。
    modRuntimeOnly "curse.maven:cloth-config-348521:5729105"
    // Applied Mekanistics (+ Mekanism) — 化学物質セル用の【任意】依存。
    // 無くても動くよう ModList で分岐しているが、コンパイルには型が要るので compileOnly。
    // runtimeOnly は dev で実際に化学物質セルを触るためのもの。
    modCompileOnly "curse.maven:mekanism-268560:6552911"
    modCompileOnly "curse.maven:applied-mekanistics-574300:7244744"
    // -PwithAppMek=false を付けると dev 実行から外れる (未導入時の動作確認用)。
    if (project.findProperty('withAppMek') != 'false') {
        modRuntimeOnly "curse.maven:mekanism-268560:6552911"
        modRuntimeOnly "curse.maven:applied-mekanistics-574300:7244744"
    }
    // AppliedFlux — FE ストレージセル用の【任意】依存 (appmek と同じ扱い)。
    // FE セルは AppliedFlux の IFluxCell を実装し、セルの中身は AppliedFlux 自身の
    // セルハンドラが扱うので、型を見るために compileOnly が要る。
    modCompileOnly "curse.maven:applied-flux-965012:7651647"
    // -PwithAppFlux=false を付けると dev 実行から外れる (未導入時の動作確認用)。
    // (-PwithAstral=true でも同じものが入る。座標が同じなので重複はしない)
    if (project.findProperty('withAppFlux') != 'false') {
        modRuntimeOnly "curse.maven:applied-flux-965012:7651647"
        // AppliedFlux の mandatory 依存 (作者の共通ライブラリ)。
        modRuntimeOnly "curse.maven:glodium-957920:5226922"
    }
    modRuntimeOnly "curse.maven:guideme-1173950:8204776"
    // AE2 Things 1.2.1 — InsaneAE 階層の DISK を足す【任意】依存。DISK は AE2 Things の DISKDrive を
    // 継承し、中身は AE2 Things 自身の保存データ (disk_manager) に入るので型を見るために要る。
    // -PwithAE2Things=false を付けると dev 実行から外れる (未導入時の動作確認用)。
    modCompileOnly "curse.maven:ae2-things-forge-609977:4616683"
    if (project.findProperty('withAE2Things') != 'false') {
        modRuntimeOnly "curse.maven:ae2-things-forge-609977:4616683"
    }
    // AE2 Crafting Optimizer。
    //
    // <b>compileOnly は常に入る。</b>ACO の公開連携境界 (api.contract / api.craftingtable /
    // api.batch.v2) は「インターフェイスを実装する」形なので、反射では代用できないため。
    // jar は GitHub Releases から downloadAco が取ってくる (CI でも引ける)。
    // ここは deobf しない — ACO 自身の API はクラス名もメソッド名も難読化されないので、
    // コンパイルにはそのままで足りる。
    compileOnly acoApiJar
    //
    // 実行時は<b>従来どおり任意依存</b>。dev に載せるのは -PwithAco=true のときだけで、
    // <b>配布 jar は SRG 名なので mod* 構成で名前を戻す必要がある</b> (そのまま run/mods に置くと dev では落ちる)。
    // 既定でオフなのは、ACO が AE2 の挙動自体を変える (実行バッチの乗っ取り・プロバイダ結合等) ため
    // ACO 前提でないゲームテストが複数落ちるから。回すときは落ちる前提で読むこと。
    if (project.findProperty('withAco') == 'true') {
        // flatDir は設定時に実体が要るので、ここだけ遅延させずに取りに行く
        // (compileOnly 側の downloadAco と違い、タスクでは間に合わない)。
        if (!acoRuntimeJarFile.exists()) {
            acoRuntimeJarFile.parentFile.mkdirs()
            var runtimeUrl = "https://github.com/syarukasu/ae2-crafting-optimizer/releases/download/" +
                    "v${aco_runtime_version}/aco${aco_runtime_version}_${minecraft_version}.jar"
            logger.lifecycle("ACO ${aco_runtime_version} を取得 (dev 実行用): ${runtimeUrl}")
            new java.net.URL(runtimeUrl).withInputStream { input ->
                acoRuntimeJarFile.withOutputStream { it << input }
            }
        }
        modRuntimeOnly "blank:aco:${aco_runtime_version}"
    }
    // Astral Mekanism & Energistics — 自動搬出をネットワークへ流す互換 Mixin
    // (compat.AstralEjectorMixin) の実機テスト用【任意・オプトイン】。
    // Mixin は @Pseudo + targets 指定なのでコンパイルには要らない (Mekanism の型だけ要る)。
    // -PwithAstral=true で dev 実行に載る。既定でオフなのは、Astral が Mekanism の
    // 機械を大量に足すぶん dev の起動が重くなるため。
    // Astral は必須依存が 14 個ある (mods.toml が全部 mandatory=true)。
    // バージョンの組み合わせは実際に遊んでいるモッドパックの manifest.json から取った。
    if (project.findProperty('withAstral') == 'true') {
        modRuntimeOnly "curse.maven:astral-mekanism-1415150:8601842"
        modRuntimeOnly "curse.maven:mekanism-generators-268566:6552914"
        modRuntimeOnly "curse.maven:mekanism-tools-268567:6552915"
        modRuntimeOnly "curse.maven:evolved-mekanism-1230085:7599591"
        modRuntimeOnly "curse.maven:mekanism-extras-1026040:8247562"
        modRuntimeOnly "curse.maven:evolved-mekanism-extras-1268159:8294797"
        modRuntimeOnly "curse.maven:compact-mekanism-machines-1161015:7388773"
        modRuntimeOnly "curse.maven:mekanism-elements-1103224:6537553"
        modRuntimeOnly "curse.maven:advancedae-1084104:7939754"
        modRuntimeOnly "curse.maven:ae2addonlib-1366135:7668681"
        modRuntimeOnly "curse.maven:applied-flux-965012:7651647"
        modRuntimeOnly "curse.maven:botany-pots-353928:7612402"
        modRuntimeOnly "curse.maven:bookshelf-228525:7612389"
        modRuntimeOnly "curse.maven:stack-upgrade-integration-1510741:8298822"
        // 上の 2 つが要求する図書館 Mod。
        modRuntimeOnly "curse.maven:glodium-957920:5226922"
        modRuntimeOnly "curse.maven:iglee-library-541199:6987117"
        modRuntimeOnly "curse.maven:geckolib-388172:8285794"
    }

    // ME Infinity Cell 1.20.1-5.0.0 — 無限セルの在庫を ACO に BigInteger で見せる @Pseudo Mixin の
    // 実機確認用【任意・オプトイン】。-PwithInfinityCell=true で dev 実行に載る。
    // Mixin は文字列でクラスを指すので、コンパイルにも型は要らない。
    if (project.findProperty('withInfinityCell') == 'true') {
        modRuntimeOnly "curse.maven:me-infinity-cell-1320551:7277426"
    }

    // Advanced AE — 自前のクラフト CPU (AdvCraftingCPULogic) へ入れている compat Mixin
    // (compat.AdvCraftingCpuLogicMixin / compat.AdvCraftingCpuBudgetMixin) の実機確認用
    // 【任意・オプトイン】。-PwithAdvancedAe=true で dev 実行に載る (-PwithAstral=true にも含まれる)。
    // 既定でオフなのは、Advanced AE 自身が AE2 の挙動を変えるためゲームテストの前提が変わるから。
    if (project.findProperty('withAdvancedAe') == 'true') {
        modRuntimeOnly "curse.maven:advancedae-1084104:7939754"
        // Advanced AE の mandatory 依存。FML が止まってから分かる類なので明示しておく。
        modRuntimeOnly "curse.maven:ae2addonlib-1366135:7668681"
        modRuntimeOnly "curse.maven:geckolib-388172:8285794"
    }

    // JEI — 【任意】。AE2 15.x の JEI 連携のチャージャーに改良チャージャーを触媒として足す
    // (integration/jei)。@JeiPlugin なので JEI が無ければ読まれない。
    modCompileOnly "curse.maven:jei-238222:8500005"
    modRuntimeOnly "curse.maven:jei-238222:8500005"
    testImplementation platform("org.junit:junit-bom:5.10.2")
    testImplementation "org.junit.jupiter:junit-jupiter"
}

// 単体テストは一部でマイクラの型 (Component など) を使うが、ModDevGradle はテストの
// クラスパスに本体を載せないので、本体側のものを渡す。
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

// mods.toml と pack.mcmeta の ${} を gradle.properties の値で置換する。
// 定義の無いプロパティを参照するとエラーになる。
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [minecraft_version   : minecraft_version, minecraft_version_range: minecraft_version_range,
                             forge_version       : forge_version, forge_version_range: forge_version_range,
                             loader_version_range: loader_version_range,
                             mod_id              : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
                             mod_authors         : mod_authors, mod_description: mod_description,]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes(["Specification-Title"     : mod_id,
                    "Specification-Vendor"    : mod_authors,
                    "Specification-Version"   : "1",
                    "Implementation-Title"    : project.name,
                    "Implementation-Version"  : project.jar.archiveVersion,
                    "Implementation-Vendor"   : mod_authors,
                    "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                    // 本番の Forge はこの属性から Mixin 設定を読む。ModDevGradle の mixin { config } は
                    // 開発実行の起動引数にしか渡さないので、ここで書く。
                    "MixinConfigs"            : ["${mod_id}.mixins.json", "${mod_id}.optional.mixins.json",
                                                 "${mod_id}.aco.mixins.json"].join(",")])
    }

}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
