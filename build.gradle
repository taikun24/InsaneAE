plugins {
    id 'idea'
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.91'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang は 1.20.5 以降 Java 21 を配布しているので、Mod も 21 を狙う。
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    // AE2 / MEGA Cells / GuideME / Applied Mekanistics / Mekanism はすべてここから取れる。
    // (1.20.1 では CurseMaven を使っていたが、Modrinth maven はバージョン番号がそのまま
    //  座標になるので、どのファイル ID がどのバージョンか分からなくなる問題がない)
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // 登録済みの GameTest を全部走らせて終了する。
        gameTestServer {
            type = 'gameTestServer'
            // AE2 のテストプロット基盤に相乗りしているので ae2 名前空間も有効にする
            // (自前のプロットも ae2.<plot id> という名前で走る)。
            systemProperty 'neoforge.enabledGameTestNamespaces', "${project.mod_id},ae2"
            // これが無いと AE2 はプロットを GameTest として登録しない。
            systemProperty 'appeng.tests', 'true'
        }

        data {
            data()
            // --existing-mod: 流用している AE2 / MEGA Cells のテクスチャを
            // ExistingFileHelper に見せるため (無いとモデル生成時に存在チェックで落ちる)。
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath(),
                    '--existing-mod', 'ae2', '--existing-mod', 'megacells'
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

// localRuntime は「dev 実行では要るが、この Mod への依存として公開はしない」もの。
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Applied Energistics 2 — 必須依存。1.21.1 は NeoForge 版のみ。
    implementation "maven.modrinth:ae2:${ae2_version}"
    // GuideME — 1.20.1 では AE2 に同梱されていたガイド機能が別 Mod に分離された。
    // AE2 が必須依存として要求するので dev 実行にも要る。
    implementation "maven.modrinth:guideme:${guideme_version}"
    // MEGA Cells — 必須依存。1M〜256M のクラフトストレージはこちらが提供し、
    // InsaneAE はその上 (1G〜) を担当する。
    implementation "maven.modrinth:mega:${megacells_version}"

    // Applied Mekanistics (+ Mekanism) — 化学物質セル用の【任意】依存。
    // 無くても動くよう ModList で分岐しているが、コンパイルには型が要るので compileOnly。
    compileOnly "maven.modrinth:applied-mekanistics:${appmek_version}"
    compileOnly "maven.modrinth:mekanism:${mekanism_version}"
    // -PwithAppMek=false を付けると dev 実行から外れる (未導入時の動作確認用)。
    if (project.findProperty('withAppMek') != 'false') {
        localRuntime "maven.modrinth:applied-mekanistics:${appmek_version}"
        localRuntime "maven.modrinth:mekanism:${mekanism_version}"
    }
}

// src/main/templates 内の ${} を gradle.properties の値で置換する。
// neoforge.mods.toml はここに置いてある。
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    // これが無いと ${} 展開のときにプラットフォーム既定の文字コードで読まれ、
    // TOML 内の日本語コメントが文字化けする (Windows だと Shift_JIS 扱いになる)。
    filteringCharset = 'UTF-8'
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : mod_authors,
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // 移植中は既定の 100 件で打ち切られると全体像が見えないので上限を上げておく。
    options.compilerArgs << '-Xmaxerrs' << '2000'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
