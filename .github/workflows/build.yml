name: build

# 1.20.1 (Forge) と 1.21.1 (NeoForge) を Stonecutter で 1 つのソースから作っている。
# push のたびに両方をビルドし、GameTest を回す。

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      # 片方が落ちても、もう片方の結果は最後まで見る。
      fail-fast: false
      matrix:
        node: ['1.20.1-forge', '1.21.1-neoforge']

    steps:
      - uses: actions/checkout@v4

      # Gradle 自体 (Stonecutter) は Java 21 で動き、1.20.1 のコンパイルには Java 17 が要る。
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - run: chmod +x ./gradlew .github/scripts/gametest.sh

      - name: Build
        run: ./gradlew ":${{ matrix.node }}:build"

      - name: Game tests
        run: .github/scripts/gametest.sh "${{ matrix.node }}"

      - name: Upload jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: insaneae-${{ matrix.node }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: versions/${{ matrix.node }}/build/libs/*.jar
          if-no-files-found: error

      # 落ちたときに原因を追えるようにログを残す。
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.node }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            versions/${{ matrix.node }}/run/logs/
            gametest-${{ matrix.node }}.log
          if-no-files-found: ignore
