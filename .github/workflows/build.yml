name: build

# 1.20.1 (main) と 1.21.1 は別ブランチで並行メンテしている。
# このファイルは両ブランチに置いてあり、それぞれ自分のブランチをビルドする
# (Java のバージョンだけブランチごとに違う: main = 17 / 1.21.1 = 21)。
# 片方に cherry-pick したときにもう片方を壊していないかを、push 時点で拾うのが目的。

on:
  push:
    branches: [main, '1.21.1']
  pull_request:
    branches: [main, '1.21.1']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build

      # GameTestServer はワールドを作るので EULA への同意が要る。
      # run/ は .gitignore なのでここで用意する。
      - name: Accept EULA
        run: |
          mkdir -p run
          echo "eula=true" > run/eula.txt

      # AE2 のテストプロットに相乗りした検証を含め、登録済みの GameTest を全部走らせる。
      - name: Game tests
        run: ./gradlew runGameTestServer

      - name: Upload jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: insaneae-${{ github.ref_name }}
          path: build/libs/*.jar
          if-no-files-found: error

      # 落ちたときに原因を追えるようにログを残す。
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.ref_name }}
          path: run/logs/
          if-no-files-found: ignore
